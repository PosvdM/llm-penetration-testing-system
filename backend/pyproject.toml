[project]
name = "llm-pentest-backend"
version = "0.1.0"
description = "Backend service for the LLM Penetration Testing System"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118.0,<0.119.0",
  "httpx>=0.28.0,<0.29.0",
  "pydantic-settings>=2.11.0,<2.12.0",
  "uvicorn[standard]>=0.37.0,<0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0,<10.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
